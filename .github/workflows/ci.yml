name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Sync（严格按 uv.lock，工具版本与本地一致）
        run: uv sync --all-extras
      - name: Ruff lint
        run: uv run --no-sync ruff check src tests
      - name: Ruff format
        run: uv run --no-sync ruff format --check src tests
      - name: Mypy
        run: uv run --no-sync mypy src/solidrock

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Sync（矩阵 Python 版本按 uv.lock 安装）
        run: uv sync --all-extras --python ${{ matrix.python-version }}
      - name: Pytest（网络冒烟测试默认跳过）
        run: uv run --no-sync pytest -m "not network" --cov --cov-report=term-missing
      - name: CLI smoke
        run: |
          uv run --no-sync srq --help
          uv run --no-sync srq data --help
          uv run --no-sync srq backtest --help
          uv run --no-sync srq mcp serve --help
          uv run --no-sync python -c "import solidrock; print('solidrock', solidrock.__version__)"
