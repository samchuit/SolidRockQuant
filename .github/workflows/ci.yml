name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Create venv（避免系统 Python 的 PEP 668 限制）
        run: uv venv --python 3.12
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: Mypy
        run: uv run mypy src/solidrock

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Create venv
        run: uv venv --python ${{ matrix.python-version }}
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Pytest（网络冒烟测试默认跳过）
        run: uv run pytest -m "not network" --cov --cov-report=term-missing
      - name: CLI smoke
        run: |
          uv run srq --help
          uv run srq data --help
          uv run srq backtest --help
          uv run srq mcp serve --help
          uv run python -c "import solidrock; print('solidrock', solidrock.__version__)"
