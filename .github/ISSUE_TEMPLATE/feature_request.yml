name: 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
  - type: textarea
    id: alternative
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: checklist
    options:
      - label: 我确认这与"Agent 原生"定位相关（或对社区普遍有用）
